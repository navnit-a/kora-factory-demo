name: ci

on:
  push:
    branches: [main, platform, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q --cov=factory_demo --cov=factory_tools --cov-fail-under=80
      - run: for f in scripts/*.sh; do bash -n "$f"; done
