[project]
name = "factory-demo"
version = "0.1.0"
description = "kora agent factory demo for PlatformCon Sydney: API client, secrets rendering, tool servers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "certifi>=2024.2",
    "fastmcp>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pyyaml>=6",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_demo", "src/factory_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
